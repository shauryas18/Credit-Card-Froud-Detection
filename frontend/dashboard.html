<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/dashboard.html">

            Fraud Detection

        </a>


        <div>

            <span
                id="welcomeUser"
                class="text-white me-3">

            </span>

            <a
                href="/predict.html"
                class="btn btn-light btn-sm me-2">

                Predict

            </a>

            <a
                href="/history.html"
                class="btn btn-outline-light btn-sm me-2">

                History

            </a>

            <button
                id="logoutBtn"
                class="btn btn-danger btn-sm">

                Logout

            </button>

        </div>

    </div>

</nav>


<div class="container py-5">

    <h2 class="fw-bold">
        Dashboard
    </h2>

    <p class="text-muted">
        Credit Card Fraud Detection Overview
    </p>


    <div class="row g-4 mt-2">


        <div class="col-md-3">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Transactions
                    </h6>

                    <h2 id="totalTransactions">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Fraud Transactions
                    </h6>

                    <h2
                        id="fraudTransactions"
                        class="text-danger">

                        0

                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Legitimate
                    </h6>

                    <h2
                        id="legitimateTransactions"
                        class="text-success">

                        0

                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Fraud Percentage
                    </h6>

                    <h2 id="fraudPercentage">
                        0%
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <div class="card shadow-sm mt-5">

        <div class="card-body">

            <div class="d-flex justify-content-between">

                <h4>
                    Recent Transactions
                </h4>

                <a href="/history.html">
                    View All
                </a>

            </div>


            <div class="table-responsive mt-3">

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Amount</th>

                            <th>Prediction</th>

                            <th>Probability</th>

                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="recentTransactions">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script src="/js/dashboard.js"></script>

</body>

</html>
