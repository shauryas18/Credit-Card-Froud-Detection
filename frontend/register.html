<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body class="auth-background">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card auth-card shadow-lg">

                    <div class="card-body p-5">

                        <h2 class="text-center fw-bold">
                            Create Account
                        </h2>

                        <p class="text-center text-muted">
                            Register for Fraud Detection
                        </p>


                        <div id="message"></div>


                        <form id="registerForm">

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    minlength="6"
                                    required>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Register

                            </button>

                        </form>


                        <p class="text-center mt-4">

                            Already have an account?

                            <a href="/login.html">
                                Login
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="/js/register.js"></script>

</body>

</html>
